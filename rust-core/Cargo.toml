[package]
name = "hybrid-brain-core"
version = "0.1.0"
edition = "2021"
description = "Hot-loop neuronal simulation core - PyO3-ready, ARM64-friendly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", optional = true, features = ["extension-module"] }

[features]
default = []
python-bindings = ["dep:pyo3"]
